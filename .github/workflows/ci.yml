name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Create and activate a virtual environment so CI always uses an isolated venv
          python -m venv .venv
          # shellcheck disable=SC1091
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Add the virtualenv bin to PATH for subsequent steps
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type-check with mypy
        run: |
          mypy src/

      - name: Test with pytest
        run: |
          pytest --cov=src/brewstanza --cov-report=xml --cov-fail-under=80 tests/

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          brewstanza --version
          brewstanza --help
          brewstanza backup --help

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
